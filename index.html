<!DOCTYPE html>
<html>

<head>
    <title>My Menu Page</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>My Cafe</h1>
    <p>Welcome to our menu!</p>

    <div class="menu-container">

        <div>
            <img src="images/shake.jpg" alt="Chocolate Shake">
        </div>

        <div>
            <h2>Juice Menu</h2>

            <table>
                <tr>
                    <th>Menu</th>
                    <th>Cost</th>
                </tr>

                <tr>
                    <td>Orange Juice</td>
                    <td>Rs. 180</td>
                </tr>

                <tr>
                    <td>Apple Juice</td>
                    <td>Rs. 200</td>
                </tr>

                <tr>
                    <td>Mango Juice</td>
                    <td>Rs. 180</td>
                </tr>
            </table>
        </div>

        <div>
            <h2>Tea Menu</h2>

            <table>
                <tr>
                    <th>Menu</th>
                    <th>Cost</th>
                </tr>

                <tr>
                    <td>Doodh Patti</td>
                    <td>Rs. 100</td>
                </tr>

                <tr>
                    <td>Green Tea</td>
                    <td>Rs. 80</td>
                </tr>

                <tr>
                    <td>Kashmiri Tea</td>
                    <td>Rs. 150</td>
                </tr>
            </table>
        </div>

        <div>
            <img src="images/tea.jpg" alt="Cup of Tea">
        </div>

    </div>

    <button onclick="confirmOrder()">Confirm Order</button>

    <script>
        function confirmOrder() {
            window.alert("Thank you! Your order has been received. Enjoy your meal!");
        }
    </script>

</body>

</html>
